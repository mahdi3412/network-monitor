<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>Network Monitor Agent</title><style>body{font-family:Arial,Tahoma;background:#0b1020;color:#e8ecf7;padding:22px}.box{background:#121a2d;border:1px solid #25304a;border-radius:14px;padding:18px;margin-bottom:14px}label{display:block;margin:10px 0 5px;color:#9eabc6}input{width:100%;box-sizing:border-box;background:#0e1527;color:#fff;border:1px solid #30415f;border-radius:8px;padding:9px}button{margin-top:14px;padding:10px 14px;border:0;border-radius:8px;cursor:pointer}.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #26304a}.ok{color:#63e6a6}</style></head><body><h2>Network Monitor Agent</h2><div class="box"><div id="status">در حال بارگذاری...</div><div id="info"></div></div><div class="box"><label>آدرس سرور</label><input id="serverUrl"><label>نام</label><input id="firstName"><label>نام خانوادگی</label><input id="lastName"><label>شماره پرسنلی</label><input id="personnelId"><button id="save">ذخیره تنظیمات</button></div><script>(async()=>{const s=await window.agent.getState();serverUrl.value=s.config.serverUrl;firstName.value=s.config.firstName;lastName.value=s.config.lastName;personnelId.value=s.config.personnelId;status.innerHTML='<span class="ok">Agent آماده است</span>';const d=s.data;info.innerHTML=[["IP",d.ip],["MAC",d.mac],["Computer",d.hostname],["User",d.username],["OS",d.os+" "+d.osVersion],["RAM",d.ramMb+" MB"]].map(x=>'<div class="row"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join("")})();save.onclick=async()=>{await window.agent.saveConfig({serverUrl:serverUrl.value,firstName:firstName.value,lastName:lastName.value,personnelId:personnelId.value});alert("ذخیره شد")};</script></body></html>
