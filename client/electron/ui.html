<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><title>Network Monitor Agent</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:20px;background:#0b1020;color:#e8ecf7;font-family:Arial,Tahoma,sans-serif}
h2{margin:0 0 6px}.sub{color:#8f9bb7;margin:0 0 18px}.box{background:#121a2d;border:1px solid #25304a;border-radius:14px;padding:18px;margin-bottom:14px}
.status{display:flex;align-items:center;justify-content:space-between;gap:10px}.badge{padding:6px 10px;border-radius:999px;font-size:12px}.online{background:#123d2c;color:#63e6a6}.offline{background:#3b1b24;color:#ff8798}.pending{background:#3c3412;color:#f4d35e}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.item{background:#0e1527;border:1px solid #25304a;border-radius:10px;padding:11px}.item span{display:block;color:#8f9bb7;font-size:12px;margin-bottom:5px}.item b{word-break:break-word}
label{display:block;margin:11px 0 5px;color:#9eabc6}input{width:100%;background:#0e1527;color:#fff;border:1px solid #30415f;border-radius:8px;padding:10px}button{padding:10px 14px;border:0;border-radius:8px;cursor:pointer;background:#31598f;color:#fff;margin-top:12px}.secondary{background:#1c2a46}.actions{display:flex;gap:8px;flex-wrap:wrap}.error{margin-top:12px;color:#ff8798;white-space:pre-wrap;word-break:break-word}.success{margin-top:12px;color:#63e6a6}@media(max-width:580px){.grid{grid-template-columns:1fr}}
</style></head>
<body>
<h2>Network Monitor Agent</h2><p class="sub">سرویس مانیتورینگ سیستم و ارتباط با سرور</p>
<div class="box">
  <div class="status"><strong>وضعیت ارتباط</strong><span id="badge" class="badge pending">در حال بررسی</span></div>
  <div class="grid">
    <div class="item"><span>آخرین Heartbeat</span><b id="lastSuccess">-</b></div>
    <div class="item"><span>Latency</span><b id="latency">-</b></div>
    <div class="item"><span>Heartbeat بعدی</span><b id="next">-</b></div>
    <div class="item"><span>Agent ID</span><b id="agentId">-</b></div>
  </div>
  <div id="error" class="error"></div>
  <div class="actions"><button id="heartbeat" class="secondary">ارسال Heartbeat</button></div>
</div>
<div class="box"><strong>اطلاعات سیستم</strong><div id="info" class="grid"></div></div>
<div class="box">
  <strong>تنظیمات</strong>
  <label>آدرس سرور</label><input id="serverUrl">
  <label>نام</label><input id="firstName">
  <label>نام خانوادگی</label><input id="lastName">
  <label>شماره پرسنلی</label><input id="personnelId">
  <label>فاصله Heartbeat (ثانیه، حداقل 10)</label><input id="heartbeatSeconds" type="number" min="10">
  <button id="save">ذخیره و اتصال مجدد</button><div id="message"></div>
</div>
<script>
const $=id=>document.getElementById(id);
function formatDate(v){return v?v?new Date(v).toLocaleString("fa-IR"):"-":"-"}
function render(s){
  $("serverUrl").value=s.config.serverUrl;$("firstName").value=s.config.firstName;$("lastName").value=s.config.lastName;$("personnelId").value=s.config.personnelId;$("heartbeatSeconds").value=s.config.heartbeatSeconds;
  $("agentId").textContent=s.data.agentId;
  $("lastSuccess").textContent=formatDate(s.runtime.lastSuccess);
  $("latency").textContent=s.runtime.lastLatencyMs!=null?s.runtime.lastLatencyMs+" ms":"-";
  $("next").textContent=formatDate(s.runtime.nextHeartbeat);
  const b=$("badge");b.className="badge "+(s.runtime.connected?"online":s.runtime.lastAttempt?"offline":"pending");b.textContent=s.runtime.connected?"متصل":"قطع / در انتظار اتصال";
  $("error").textContent=s.runtime.lastError||"";
  $("info").innerHTML=[
    ["IP",s.data.ip||"-"],["MAC",s.data.mac||"-"],["Adapter",s.data.adapter||"-"],["Computer",s.data.hostname||"-"],
    ["User",s.data.username||"-"],["نام",((s.data.firstName||"")+" "+(s.data.lastName||"")).trim()||"-"],
    ["پرسنلی",s.data.personnelId||"-"],["OS",(s.data.os||"")+" "+(s.data.osVersion||"")],
    ["CPU",s.data.cpu||"-"],["RAM",(s.data.ramMb||0)+" MB"],["Agent",s.data.agentVersion||"-"]
  ].map(x=>'<div class="item"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join("");
}
(async()=>{render(await window.agent.getState());window.agent.onState(render)})();
$("heartbeat").onclick=()=>window.agent.heartbeatNow();
$("save").onclick=async()=>{const s=await window.agent.saveConfig({serverUrl:$("serverUrl").value,firstName:$("firstName").value,lastName:$("lastName").value,personnelId:$("personnelId").value,heartbeatSeconds:$("heartbeatSeconds").value});render(s);$("message").className="success";$("message").textContent="تنظیمات ذخیره شد و اتصال مجدداً بررسی شد."};
</script></body></html>
